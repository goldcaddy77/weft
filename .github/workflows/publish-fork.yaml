name: publish-fork

# Publishes this fork to GitHub Packages as `@goldcaddy77/weft`.
#
# Deliberately keyed on a `fork-v*` tag rather than `v*`: the upstream
# `release.yaml` workflow fires on `v*.*.*` and publishes to npmjs under
# `@lostgradient`, a scope this fork's owner does not control. A shared tag
# prefix would fire both.
on:
  push:
    tags:
      - 'fork-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.18.2)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@goldcaddy77'

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#fork-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The upstream gates run against the upstream manifest, so they run BEFORE
      # the rename. A fork tag must not be able to publish code that never had
      # lint, typecheck and tests run against it.
      - name: Run lint, typecheck, and tests
        run: bun run validate

      - name: Build
        run: bun run build

      - name: Rename for the fork scope
        run: bun run scripts/prepare-fork-publish.ts "${{ steps.version.outputs.value }}"

      # --ignore-scripts because the rename already stripped the upstream
      # lifecycle gates; anything left would re-run against a manifest they were
      # never written for.
      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
