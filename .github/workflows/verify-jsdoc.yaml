name: verify-jsdoc

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'reference/jsdoc-manifest.json'
      - 'scripts/audit-jsdoc-manifest.ts'
      - 'scripts/build-jsdoc-manifest.ts'
      - 'scripts/check-declaration-jsdoc.ts'
      - 'scripts/classify-jsdoc-manifest.ts'
      - 'scripts/extract-doctests.ts'
      - '.github/workflows/verify-jsdoc.yaml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit manifest (asserts public surface in sync; fails on missing JSDoc)
        run: bun run verify:jsdoc

      - name: Compile @example doctests
        run: bun run verify:jsdoc:doctests

      - name: Build package (so emitted .d.ts exists for declaration check)
        run: bun run build

      - name: Verify declaration JSDoc survives the re-export chain
        run: bun run verify:jsdoc:declarations
